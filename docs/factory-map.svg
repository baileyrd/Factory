<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" width="1500" height="1120" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b98a5"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ea1ff"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <style>
      .t{fill:#e6edf3}.m{fill:#8b98a5}.h{font-size:17px;font-weight:600}.s{font-size:13px}.xs{font-size:11.5px}
      .mono{font-family:Consolas, "Cascadia Mono", Menlo, monospace}
      .panel{fill:#161d26;stroke-width:1.5}
      .chip{fill:#1d2632;stroke:#2a3644}
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#0f1419"/>

  <!-- Title -->
  <text x="40" y="44" class="t" font-size="24" font-weight="700">Software factory: how the pieces fit</text>
  <text x="40" y="68" class="m s">Generic catalog + benched project agents, bound per project by an overlay, run as role threads on Mill Board, improved by Retro</text>

  <!-- ============ ROW 1: SOURCES + OVERLAY ============ -->
  <!-- Catalog -->
  <rect x="40" y="96" width="420" height="270" rx="12" class="panel" stroke="#4ea1ff"/>
  <text x="60" y="126" class="t h">Factory catalog</text>
  <text x="60" y="146" class="m xs">generic: knows no project</text>
  <rect x="60" y="160" width="380" height="58" rx="8" class="chip"/>
  <text x="76" y="184" class="t s mono">roles/</text>
  <text x="76" y="204" class="m xs">Planner · Architect · Builder · Reviewer · Tester · Retro + _protocol.md</text>
  <rect x="60" y="228" width="380" height="58" rx="8" class="chip"/>
  <text x="76" y="252" class="t s mono">knowledge/</text>
  <text x="76" y="272" class="m xs">59 domain experts (console, terminal, GUI, Rust, CI…)</text>
  <rect x="60" y="296" width="380" height="58" rx="8" class="chip"/>
  <text x="76" y="320" class="t s mono">standards/</text>
  <text x="76" y="340" class="m xs">rust · interface · gui: musts (blockable) / shoulds (flagged)</text>

  <!-- Expert-Agents -->
  <rect x="1040" y="96" width="420" height="270" rx="12" class="panel" stroke="#3fb950"/>
  <text x="1060" y="126" class="t h">Expert-Agents repo</text>
  <text x="1060" y="146" class="m xs">project-bound, grounded in review fixes, benched</text>
  <rect x="1060" y="160" width="380" height="44" rx="8" class="chip"/>
  <text x="1076" y="187" class="t s"><tspan class="mono">experts/&lt;p&gt;</tspan><tspan class="m xs" dx="10">benched reviewers (10)</tspan></text>
  <rect x="1060" y="212" width="380" height="44" rx="8" class="chip"/>
  <text x="1076" y="239" class="t s"><tspan class="mono">developers/&lt;p&gt;</tspan><tspan class="m xs" dx="10">builders paired with reviewers (6)</tspan></text>
  <rect x="1060" y="264" width="380" height="44" rx="8" class="chip"/>
  <text x="1076" y="291" class="t s"><tspan class="mono">interview · grounding</tspan><tspan class="m xs" dx="10">traits, defect classes</tspan></text>
  <rect x="1060" y="316" width="380" height="40" rx="8" class="chip"/>
  <text x="1076" y="341" class="t s"><tspan class="mono">bench/ · reports/</tspan><tspan class="m xs" dx="10">no promotion without a bench</tspan></text>

  <!-- Overlay -->
  <rect x="520" y="96" width="460" height="270" rx="12" class="panel" stroke="#d29922" stroke-width="2"/>
  <text x="540" y="126" class="t h">Project overlay</text>
  <text x="540" y="146" class="m xs mono">.factory/overlay.md in the target repo · adds, never loosens</text>
  <g class="s">
    <text x="540" y="176" class="t">Brief</text>               <text x="700" y="176" class="m xs">← interview.md</text>
    <text x="540" y="201" class="t">Experts</text>             <text x="700" y="201" class="m xs">← interview traits → knowledge/</text>
    <text x="540" y="226" class="t">Standards</text>           <text x="700" y="226" class="m xs">← standards/</text>
    <text x="540" y="251" class="t">Project rules</text>       <text x="700" y="251" class="m xs">← Authority + Invariants</text>
    <text x="540" y="276" class="t">Reviewer / Tester</text>   <text x="700" y="276" class="m xs">← axes + grounding defect classes</text>
    <text x="540" y="301" class="t">Oracles</text>             <text x="700" y="301" class="m xs">← Evidence, strongest first</text>
    <text x="540" y="326" class="t">Planner / Architect</text> <text x="700" y="326" class="m xs">→ link ROADMAP + design docs (thin)</text>
  </g>
  <text x="540" y="352" class="xs" fill="#d29922">Gaps: no interview for mux, mill-board, general; no Rusty Term grounding</text>

  <!-- arrows into overlay -->
  <path d="M460,230 L516,230" stroke="#4ea1ff" stroke-width="2" fill="none" marker-end="url(#aB)"/>
  <text x="468" y="220" class="xs" fill="#4ea1ff">select</text>
  <path d="M1040,230 L984,230" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <text x="988" y="220" class="xs" fill="#3fb950">extract</text>

  <!-- ============ ROW 2: RESOLUTION ============ -->
  <rect x="300" y="410" width="900" height="92" rx="12" class="panel" stroke="#a371f7"/>
  <text x="320" y="438" class="t h">Role resolution, per card and role</text>
  <text x="320" y="464" class="s t">Benched project agent exists?  <tspan fill="#3fb950">Yes → use it</tspan><tspan class="m" dx="6">(Reviewer → experts/&lt;p&gt;, Builder → developers/&lt;p&gt;)</tspan></text>
  <text x="320" y="488" class="s t"><tspan fill="#4ea1ff">No → base role</tspan><tspan class="m" dx="6">+ overlay + only the knowledge and standards the overlay lists and the card touches</tspan></text>

  <path d="M250,366 C250,400 280,430 296,440" stroke="#4ea1ff" stroke-width="1.6" fill="none" marker-end="url(#aB)"/>
  <path d="M750,366 L750,406" stroke="#d29922" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M1250,366 C1250,400 1220,430 1204,440" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#aG)"/>
  <path d="M750,502 L750,540" stroke="#a371f7" stroke-width="1.6" fill="none" marker-end="url(#aP)"/>

  <!-- ============ ROW 3: PIPELINE ============ -->
  <rect x="30" y="544" width="1440" height="316" rx="12" fill="#121922" stroke="#2a3644"/>
  <text x="50" y="572" class="t h">Role threads on Mill Board</text>
  <text x="290" y="572" class="m xs">each thread: take a card in its column → work → post handoff block → move card · Tester and Reviewer are involved from the first requirement</text>
  <g stroke="#2a3644" stroke-width="1" stroke-dasharray="3 4">
    <path d="M125,678 L125,692"/>
    <path d="M332,678 L332,692"/>
    <path d="M538,678 L538,692"/>
    <path d="M745,678 L745,692"/>
    <path d="M952,678 L952,692"/>
    <path d="M1158,678 L1158,692"/>
  </g>
  <g>
    <rect x="50" y="592" width="150" height="86" rx="10" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="125" y="620" class="t s" text-anchor="middle" font-weight="600">Planner</text>
    <text x="125" y="642" class="m xs" text-anchor="middle">research (cited)</text>
    <text x="125" y="660" class="m xs" text-anchor="middle">requirements + AC</text>
    <rect x="257" y="592" width="150" height="86" rx="10" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="332" y="620" class="t s" text-anchor="middle" font-weight="600">Architect</text>
    <text x="332" y="642" class="m xs" text-anchor="middle">design + contracts</text>
    <text x="332" y="660" class="m xs" text-anchor="middle">decisions recorded</text>
    <rect x="463" y="592" width="150" height="86" rx="10" fill="#2a1416" stroke="#f85149" stroke-width="2"/>
    <text x="538" y="620" class="t s" text-anchor="middle" font-weight="600">Gate 1</text>
    <text x="538" y="642" fill="#f85149" class="xs" text-anchor="middle">design approval</text>
    <text x="538" y="660" class="m xs" text-anchor="middle">Approver (Nano)</text>
    <rect x="670" y="592" width="150" height="86" rx="10" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="745" y="620" class="t s" text-anchor="middle" font-weight="600">Builder</text>
    <text x="745" y="642" class="m xs" text-anchor="middle">makes the tests pass</text>
    <text x="745" y="660" class="m xs" text-anchor="middle">code + guides · 6 tries</text>
    <rect x="877" y="592" width="150" height="86" rx="10" fill="#2a2410" stroke="#e3b341" stroke-width="2"/>
    <text x="952" y="620" class="t s" text-anchor="middle" font-weight="600">V&amp;V Test</text>
    <text x="952" y="642" fill="#e3b341" class="xs" text-anchor="middle">full run: unit → e2e</text>
    <text x="952" y="660" class="m xs" text-anchor="middle">guides + acceptance</text>
    <rect x="1083" y="592" width="150" height="86" rx="10" fill="#2a1416" stroke="#f85149" stroke-width="2"/>
    <text x="1158" y="620" class="t s" text-anchor="middle" font-weight="600">Gate 2</text>
    <text x="1158" y="642" fill="#f85149" class="xs" text-anchor="middle">merge approval</text>
    <text x="1158" y="660" class="m xs" text-anchor="middle">Approver (Nano)</text>
    <rect x="1290" y="592" width="150" height="86" rx="10" fill="#1d2632" stroke="#2a3644" stroke-width="1.5"/>
    <text x="1365" y="620" class="t s" text-anchor="middle" font-weight="600">Done</text>
    <text x="1365" y="642" class="m xs" text-anchor="middle">merged</text>
  </g>
  <g stroke="#8b98a5" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M200,635 L253,635"/>
    <path d="M407,635 L459,635"/>
    <path d="M613,635 L666,635"/>
    <path d="M820,635 L873,635"/>
    <path d="M1027,635 L1079,635"/>
    <path d="M1233,635 L1286,635"/>
  </g>
  <rect x="50" y="692" width="1183" height="158" rx="10" fill="#1a2230" stroke="#2a3644" stroke-width="1.5"/>
  <text x="66" y="714" class="t s" font-weight="600">Alongside the line, from the first requirement</text>
  <text x="66" y="740" class="xs" font-weight="600" fill="#e3b341">TEST · Tester</text>
  <text x="125" y="760" class="xs" fill="#e3b341" text-anchor="middle">test plan from reqs</text>
  <text x="332" y="760" class="xs" fill="#e3b341" text-anchor="middle">testability check</text>
  <text x="538" y="760" class="xs" fill="#e3b341" text-anchor="middle">writes tests first (fail)</text>
  <text x="952" y="760" class="xs" fill="#e3b341" text-anchor="middle">runs V&amp;V Test</text>
  <text x="1158" y="760" class="xs" fill="#e3b341" text-anchor="middle">evidence to Gate 2</text>
  <path d="M66,776 L1217,776" stroke="#2a3644" stroke-width="1"/>
  <text x="66" y="798" class="xs" font-weight="600" fill="#a371f7">REVIEW · Reviewer</text>
  <text x="125" y="818" class="xs" fill="#a371f7" text-anchor="middle">reviews requirements</text>
  <text x="332" y="818" class="xs" fill="#a371f7" text-anchor="middle">reviews design</text>
  <text x="538" y="818" class="xs" fill="#a371f7" text-anchor="middle">reviews tests</text>
  <text x="745" y="818" class="xs" fill="#a371f7" text-anchor="middle">reviews code + docs</text>
  <text x="952" y="818" class="xs" fill="#a371f7" text-anchor="middle">reviews results</text>
  <text x="1158" y="818" class="xs" fill="#a371f7" text-anchor="middle">flags shoulds</text>
  <text x="66" y="840" class="m xs">Untestable design = blocking finding · Reviewer checks the Tester's tests and settles Builder challenges · neither is ever the Builder</text>
  <text x="1357" y="878" class="xs" fill="#39c5cf" text-anchor="end">every card →</text>

  <!-- ============ ROW 4: RETRO LOOP ============ -->
  <rect x="40" y="890" width="1420" height="196" rx="12" class="panel" stroke="#39c5cf"/>
  <text x="60" y="920" class="t h">Retro: after every card</text>
  <text x="60" y="942" class="m xs">logs every gap · proposes a change only when it recurs · Approver approves every change · never touches gates or separation of duties</text>

  <rect x="60" y="960" width="300" height="104" rx="10" fill="#1d2632" stroke="#39c5cf"/>
  <text x="80" y="988" class="t s" font-weight="600">Retro proposal</text>
  <text x="80" y="1010" class="m xs">small diff to one file</text>
  <text x="80" y="1028" class="m xs">+ the incidents it fixes</text>
  <text x="80" y="1046" class="m xs">→ Approver</text>

  <g stroke="#39c5cf" stroke-width="1.6" fill="none" marker-end="url(#aT)">
    <path d="M360,990 L430,990"/><path d="M360,1014 C400,1014 400,1038 430,1038"/><path d="M360,1014 C400,1014 400,1070 430,1064"/>
  </g>

  <rect x="434" y="966" width="320" height="44" rx="8" class="chip" stroke="#d29922"/>
  <text x="450" y="993" class="t s"><tspan fill="#d29922">Overlay</tspan><tspan class="m xs" dx="10">recurs on that project</tspan></text>
  <rect x="434" y="1018" width="320" height="30" rx="8" class="chip" stroke="#4ea1ff"/>
  <text x="450" y="1038" class="t s"><tspan fill="#4ea1ff">Catalog (base)</tspan><tspan class="m xs" dx="10">recurs on 2+ projects</tspan></text>
  <rect x="434" y="1052" width="320" height="28" rx="8" class="chip" stroke="#3fb950"/>
  <text x="450" y="1071" class="t s"><tspan fill="#3fb950">Benched agent</tspan><tspan class="m xs" dx="10">variant → bench → promote</tspan></text>

  <!-- pipeline → retro -->
  <path d="M1365,678 L1365,886" stroke="#39c5cf" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#aT)"/>

  <!-- legend -->
  <g class="xs">
    <rect x="820" y="970" width="14" height="14" rx="3" fill="none" stroke="#4ea1ff"/><text x="842" y="982" class="m">generic catalog</text>
    <rect x="820" y="994" width="14" height="14" rx="3" fill="none" stroke="#3fb950"/><text x="842" y="1006" class="m">Expert-Agents (benched, project-bound)</text>
    <rect x="820" y="1018" width="14" height="14" rx="3" fill="none" stroke="#d29922"/><text x="842" y="1030" class="m">overlay (binding, in target repo)</text>
    <rect x="1120" y="970" width="14" height="14" rx="3" fill="none" stroke="#a371f7"/><text x="1142" y="982" class="m">role threads</text>
    <rect x="1120" y="994" width="14" height="14" rx="3" fill="none" stroke="#f85149"/><text x="1142" y="1006" class="m">human gates</text>
    <rect x="1120" y="1018" width="14" height="14" rx="3" fill="none" stroke="#39c5cf"/><text x="1142" y="1030" class="m">improvement loop</text>
    <text x="820" y="1062" class="m">Models are config: any provider can fill a role, but Reviewer/Tester never share a provider with the Builder.</text>
  </g>
</svg>
